name: Release

# Push a tag to cut a release:
#   git tag v1.2.0 && git push origin v1.2.0
#
# Requires four repository secrets (Settings → Secrets and variables → Actions).
# Without them the build falls back to the debug key, which Google Play
# rejects, so the workflow checks and fails early instead.
#
#   KEYSTORE_BASE64   base64 of android/super_calculadora.jks
#                     PowerShell: [Convert]::ToBase64String([IO.File]::ReadAllBytes("android\super_calculadora.jks")) | Set-Clipboard
#                     bash:       base64 -w0 android/super_calculadora.jks
#   STORE_PASSWORD    keystore password
#   KEY_PASSWORD      key password
#   KEY_ALIAS         key alias (super_calculadora)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release'
        required: true

env:
  FLUTTER_VERSION: '3.35.3'
  # Gradle 8.12 + AGP 8.7.3 require JDK 17-21.
  JAVA_VERSION: '21'

jobs:
  release:
    name: Build signed artifacts and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Require signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. Artifacts would be signed with the debug key and Play would reject them."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/super_calculadora.jks
          # storeFile is resolved relative to android/app, matching local builds.
          cat > android/key.properties <<EOF
          storeFile=../super_calculadora.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build signed APK
        run: flutter build apk --release

      - name: Build signed App Bundle
        run: flutter build appbundle --release

      - name: Verify the artifacts are release-signed
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | tee certs.txt
          if grep -qi "CN=Android Debug" certs.txt; then
            echo "::error::APK is signed with the debug key."
            exit 1
          fi
          "$BT/aapt" dump badging build/app/outputs/flutter-apk/app-release.apk | grep "^package:"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/bundle/release/app-release.aab \
            || gh release upload "$TAG" \
                 build/app/outputs/flutter-apk/app-release.apk \
                 build/app/outputs/bundle/release/app-release.aab --clobber

      # Never leave the signing material behind on the runner.
      - name: Scrub signing material
        if: always()
        run: rm -f android/super_calculadora.jks android/key.properties certs.txt
