name: Release

# Push a tag to cut a release:
#   git tag v1.2.0 && git push origin v1.2.0
#
# Requires four repository secrets (Settings → Secrets and variables → Actions).
# Without them the build falls back to the debug key, which Google Play
# rejects, so the workflow checks and fails early instead.
#
#   KEYSTORE_BASE64   base64 of android/super_calculadora.jks
#                     PowerShell: [Convert]::ToBase64String([IO.File]::ReadAllBytes("android\super_calculadora.jks")) | Set-Clipboard
#                     bash:       base64 -w0 android/super_calculadora.jks
#   STORE_PASSWORD    keystore password
#   KEY_PASSWORD      key password
#   KEY_ALIAS         key alias (super_calculadora)
#
# Third-party actions are pinned to commit SHAs here, unlike in ci.yml. A tag
# such as @v4 can be repointed by whoever owns the action, and anything running
# in this workflow sees the signing key in clear. The trailing comment records
# which release each SHA corresponds to; Dependabot keeps them current.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release. Leave empty for a dry run on the selected branch.'
        required: false
      dry_run:
        description: 'Build and verify signing without publishing anything'
        type: boolean
        default: false

env:
  FLUTTER_VERSION: '3.35.3'
  # Gradle 8.12 + AGP 8.7.3 require JDK 17-21.
  JAVA_VERSION: '21'

jobs:
  release:
    name: Build signed artifacts and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Require signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. Artifacts would be signed with the debug key and Play would reject them."
            exit 1
          fi

      # A real release must name a tag. Without this, running the workflow by
      # hand on a branch would publish a release called "main".
      - name: Require a tag unless this is a dry run
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          REF="${{ github.ref }}"
          TAG_INPUT="${{ github.event.inputs.tag }}"
          if [ -z "$TAG_INPUT" ] && [[ "$REF" != refs/tags/* ]]; then
            echo "::error::No tag given and this is not a tag push. Pass a tag, or tick dry_run to only build and verify."
            exit 1
          fi

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/super_calculadora.jks
          # storeFile is resolved relative to android/app, matching local builds.
          cat > android/key.properties <<EOF
          storeFile=../super_calculadora.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build signed APK
        run: flutter build apk --release

      - name: Build signed App Bundle
        run: flutter build appbundle --release

      - name: Verify the artifacts are release-signed
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | tee certs.txt
          if grep -qi "CN=Android Debug" certs.txt; then
            echo "::error::APK is signed with the debug key."
            exit 1
          fi
          "$BT/aapt" dump badging build/app/outputs/flutter-apk/app-release.apk | grep "^package:"

      # Only the APK goes on the release: that is what people can actually
      # install, and it matches how earlier releases were published.
      - name: Publish the release with the APK
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" --title "$TAG" --generate-notes \
            build/app/outputs/flutter-apk/app-release.apk \
            || gh release upload "$TAG" \
                 build/app/outputs/flutter-apk/app-release.apk --clobber

      # Branch names contain slashes, which are not allowed in artifact names.
      - name: Name the bundle artifact
        id: names
        run: |
          RAW="${{ github.event.inputs.tag || github.ref_name }}"
          echo "artifact=play-appbundle-${RAW//\//-}" >> "$GITHUB_OUTPUT"

      # The bundle is for Play, not for end users, so it stays a build
      # artifact: download it from this run and upload it to the Play Console.
      # Kept on dry runs too, so the build can be inspected.
      - name: Upload the App Bundle for Play
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.names.outputs.artifact }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 90

      - name: Dry run summary
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          echo "### Dry run: built and signature-verified, nothing published" >> "$GITHUB_STEP_SUMMARY"
          echo "Use this to check a change to this workflow before merging it." >> "$GITHUB_STEP_SUMMARY"

      # Never leave the signing material behind on the runner.
      - name: Scrub signing material
        if: always()
        run: rm -f android/super_calculadora.jks android/key.properties certs.txt
